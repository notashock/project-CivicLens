<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="ct-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>
  <!-- Rounded Brand Squircle -->
  <rect width="32" height="32" rx="8" fill="url(#ct-grad)"/>
  
  <!-- Outer Radio Wave / Spatial Radar -->
  <circle cx="16" cy="16" r="10.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Middle Broadcast Wave -->
  <path d="M10.34 10.34a8 8 0 0 1 11.32 0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M10.34 21.66a8 8 0 0 0 11.32 0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Inner Wave -->
  <path d="M12.46 12.46a5 5 0 0 1 7.08 0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M12.46 19.54a5 5 0 0 0 7.08 0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Central Pulse Dot -->
  <circle cx="16" cy="16" r="2.5" fill="#FFFFFF"/>
</svg>
