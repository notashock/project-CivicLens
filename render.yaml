services:
  # ============================================================================
  # MONOLITH ARCHITECTURE (RECOMMENDED FOR RENDER FREE TIER)
  # Uses 1 Free Service = Fits within 750 free instance hours/month quota.
  # Both Next.js 15 PWA and FastAPI run in a single container with strict memory caps.
  # ============================================================================
  - type: web
    name: civiclens-monolith
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_POOL_MAX
        value: "3"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: ENABLE_DOCS
        value: "false"
      - key: API_WORKERS
        value: "1"
      - key: PORT
        value: "3000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=192"
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: postgresql://...
